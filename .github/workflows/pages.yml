# Publish the basin explorer on GitHub Pages. No data is in git: the job downloads the
# web data bundle (JSON + the web tileset listed in tiles.json, ~0.45 GB) from this repo's
# release assets (data_bundles.json, bundle "explorer"), checks SHA-256, and deploys
# explorer/ as the site. The web tileset has every river and waterbody (web_low.pmtiles
# z3-8, regional web_*.pmtiles z9-10, each < 95 MB; explorer/scripts/build_web_tiles.py).
# The single full-resolution file (983 MB, optional in the bundle) is left out: GitHub
# Pages allows 100 MB per file and 1 GB per site. PMTiles reads tiles with HTTP Range
# requests, which GitHub Pages serves (206 Partial Content).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download explorer data bundle (SHA-256 checked)
        run: python3 tools/fetch_bundle.py explorer
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp explorer/index.html _site/
          python3 - <<'EOF'
          import json, shutil
          b = json.load(open("data_bundles.json"))["bundles"]["explorer"]
          for name, meta in b["files"].items():
              if meta.get("required", True):
                  shutil.copy2(f"explorer/data/{name}", f"_site/data/{name}")
          # GitHub Pages limits: 100 MB per file, 1 GB per site
          import os
          sizes = {f: os.path.getsize(f"_site/data/{f}") for f in os.listdir("_site/data")}
          big = {f: s for f, s in sizes.items() if s > 100_000_000}
          assert not big, f"files over 100 MB: {big}"
          assert sum(sizes.values()) < 1_000_000_000, f"site data {sum(sizes.values()):,} bytes"
          EOF
          du -ah _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
