[project]
name = "repro-diffusive-mainstem"
version = "1.0.0"
description = "Screen the NWM v3.1.7 network for known Muskingum-Cunge error regimes and size candidate diffusive-routing mainstems"
requires-python = "==3.12.*"
# Exact pins for direct dependencies; uv.lock pins the full tree with hashes.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "xarray==2026.9.0",
    "netcdf4==1.7.4",
    "matplotlib==3.11.2",
    "pyarrow==25.0.1",
    "py7zr==1.1.3",
    "dbfread==2.0.7",
    "shapely==2.2.0",
    "pyogrio==0.13.0",
    "geopandas==1.2.0",
    "scipy==1.18.1",
]

[tool.uv]
package = false
